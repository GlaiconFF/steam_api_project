{% extends 'base.html' %}
{% block content %}

        {% if error %}

            <p class="error">
                {{ translation['steam_api_error'] }}
            </p>

        {% endif %}

        {% if recommended_games %}

            {% for game, image in recommended_games.items() %}

            <img src="{{ image }}" >
            <span>{{ game }}</span>

            {% endfor %}

        {% endif %}
        
{% endblock %}

{% block scripts %}
{% endblock %}

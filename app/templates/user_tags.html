{% extends 'base.html' %}
{% block content %}

<div>

            <h3 class="show_tags">
                {{ translation['game_tags'] }}
            </h3>

            <input
                type="text"
                id="tag_search"
                placeholder="{{ translation['search_tag'] }}"
                class="tag_search_input"
            >

            <button
                id="show_all_tags_button"
                class="show_all_tags_button"
                data-show="{{ translation['show_all_tags'] }}"
                data-hide="{{ translation['hide_all_tags'] }}"
            >
                {{ translation['show_all_tags'] }}
            </button>

            <button
                id="select_all_tags_button"
                class="select_all_tags_button"
                data-show="{{ translation['select_all_tags'] }}"
                data-hide="{{ translation['remove_all_tags'] }}"
            >
                {{ translation['select_all_tags'] }}
            </button>

        </div>

        <div class="tags_container">

        {% for tag_id, tag_name in steam_tags.items() %}

            <div
                class="tag {% if tag_id in selected_tags %}active{% endif %}"
                data-id="{{ tag_id }}"
            >

                {{ tag_name }}

            </div>

        {% endfor %}

        </div>

    </main>

{% endblock %}

{% block scripts %}
<script>

const tags = document.querySelectorAll(".tag")

const tagSearch = document.getElementById("tag_search")

tagSearch.value =
    localStorage.getItem("tagSearchValue") || ""

const showAllTagsButton =
    document.getElementById("show_all_tags_button")

const selectAllTagsButton =
    document.getElementById("select_all_tags_button")

let showingAllTags =
    localStorage.getItem("showingAllTags") === "true"

function updateSelectAllButton() {

    const activeTags =
        document.querySelectorAll(".tag.active")

    if (activeTags.length > 0) {

        selectAllTagsButton.textContent =
            selectAllTagsButton.dataset.hide

    }

    else {

        selectAllTagsButton.textContent =
            selectAllTagsButton.dataset.show

    }

}

tags.forEach(tag => {

    tag.addEventListener("click", async () => {

        tag.classList.toggle("active")

        const tagId = tag.dataset.id

        await fetch(`/toggle_tag/${tagId}`)

        updateSelectAllButton()

    })

})

if (showingAllTags) {

    tags.forEach(tag => {
        tag.style.display = "inline-block"
    })

    showAllTagsButton.textContent =
        showAllTagsButton.dataset.hide

}

else {

    tags.forEach(tag => {
        tag.style.display = "none"
    })

}

showAllTagsButton.addEventListener("click", () => {

    const showText = showAllTagsButton.dataset.show

    const hideText = showAllTagsButton.dataset.hide

    showingAllTags = !showingAllTags

    localStorage.setItem(
        "showingAllTags",
        showingAllTags
    )

    if (showingAllTags) {

        tags.forEach(tag => {
            tag.style.display = "inline-block"
        })

        showAllTagsButton.textContent = hideText

    }

    else {

        tags.forEach(tag => {
            tag.style.display = "none"
        })

        showAllTagsButton.textContent = showText

    }

})

tagSearch.addEventListener("input", () => {

    localStorage.setItem(
        "tagSearchValue",
        tagSearch.value
    )

    const search =
        tagSearch.value.toLowerCase()

    if (search === "") {

        if (!showingAllTags) {

            tags.forEach(tag => {
                tag.style.display = "none"
            })

        }

        else {

            tags.forEach(tag => {
                tag.style.display = "inline-block"
            })

        }

        return

    }

    tags.forEach(tag => {

        const tagName =
            tag.textContent.toLowerCase()

        if (tagName.includes(search)) {

            tag.style.display = "inline-block"

        }

        else {

            tag.style.display = "none"

        }

    })

})

if (tagSearch.value !== "") {

    const search =
        tagSearch.value.toLowerCase()

    tags.forEach(tag => {

        const tagName =
            tag.textContent.toLowerCase()

        if (tagName.includes(search)) {

            tag.style.display = "inline-block"

        }

        else {

            tag.style.display = "none"

        }

    })

}

updateSelectAllButton()

selectAllTagsButton.addEventListener("click", async () => {

    const activeTags =
        document.querySelectorAll(".tag.active")

    const shouldRemove =
        activeTags.length > 0

    await fetch(`/set_all_tags/${shouldRemove}`)

    tags.forEach(tag => {

        if (shouldRemove) {

            tag.classList.remove("active")

        }

        else {

            tag.classList.add("active")

        }

    })

    updateSelectAllButton()

})

</script>
{% endblock %}
